<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{width:100%;height:100%;margin:0}.core,.optional,.hotel{width:25px;height:25px;line-height:22px;text-align:center;font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 1px 4px #555}.core{border-radius:50%;color:#1e3a8a;background:#dbeafe;border:2px solid #1d4ed8}.optional{border-radius:50%;color:#0369a1;background:#e0f2fe;border:2px solid #38bdf8}.hotel{border-radius:3px;color:#1e3a8a;background:#eff6ff;border:2px solid #1d4ed8}</style></head><body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const p=[[33.58620229,130.41831968,'파크사이드 인 하카타','hotel'],[33.59010,130.39830,'텐진역 코인락커·텐진 쇼핑','optional'],[33.588668,130.394839,'탄야키 우나후지 후쿠오카 다이묘 별저','core'],[33.59010,130.39830,'텐진역 코인락커·짐 수령','optional'],[33.58540,130.44710,'후쿠오카 국제선 공항','core']];
const m=L.map('map',{zoomControl:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(m);const x=p.map(a=>[a[0],a[1]]);L.polyline(x,{color:'#2563eb',weight:5,opacity:.85}).addTo(m);p.forEach((a,i)=>L.marker([a[0],a[1]],{icon:L.divIcon({className:'',html:'<div class="'+a[3]+'">'+(i+1)+'</div>',iconSize:[27,27],iconAnchor:[13,13]})}).addTo(m).bindPopup('<b>'+(i+1)+'. </b>'+a[2]));m.fitBounds(x,{padding:[38,38]});
</script></body></html>
