const m=L.map('map',{zoomControl:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(m);let all=[];const seen=new Map();function makeIcon(v){const ds=[...new Set(v.items.map(x=>x.day))];const label=ds.length>1?ds.join('·'):v.items.map(x=>x.day+'-'+x.no).join('·');const color=ds.length>1?'#334155':v.color;return L.divIcon({className:'',html:'<div class="pin '+v.kind+'" style="background:'+color+'">'+label+'</div>',iconSize:[52,27],iconAnchor:[26,13]})}function popup(v){return v.items.map(x=>'<b>'+x.day+'일차 '+x.no+'. </b>'+x.name).join('<br>')}days.forEach((d,di)=>{const x=d.p.map(a=>[a[0],a[1]]);all=all.concat(x);L.polyline(x,{color:d.color,weight:4,opacity:.78}).addTo(m);d.p.forEach((a,i)=>{const key=a[0].toFixed(6)+','+a[1].toFixed(6),item={day:di+1,no:i+1,name:a[2]};if(seen.has(key)){const v=seen.get(key);v.items.push(item);v.marker.setIcon(makeIcon(v));v.marker.setPopupContent(popup(v));return}const v={items:[item],kind:a[3],color:d.color};v.marker=L.marker([a[0],a[1]],{icon:makeIcon(v)}).addTo(m).bindPopup(popup(v));seen.set(key,v)})});const legend=L.control({position:'bottomleft'});legend.onAdd=()=>{const e=L.DomUtil.create('div');e.style.cssText='background:#fff;padding:5px 7px;border-radius:4px;font:12px sans-serif;box-shadow:0 1px 4px #777';e.innerHTML='<span style="color:#ea580c">■</span> 1일차&nbsp; <span style="color:#16a34a">■</span> 2일차&nbsp; <span style="color:#2563eb">■</span> 3일차&nbsp; <span style="color:#9333ea">■</span> 4일차';return e};legend.addTo(m);m.fitBounds(all,{padding:[35,35]});
